# Fine-tune a 7B model on cluster M1 (8x H100 SXM 80GB).
name: qwen2.5-7b-sft
cluster: m1
gpus: 8
gpu_type: H100
tier: reserved
image: nvcr.io/nvidia/pytorch:24.10-py3
command:
  - python
  - train.py
  - --model
  - Qwen/Qwen2.5-7B
  - --epochs
  - "3"
env:
  HF_TOKEN: ${HF_TOKEN}
storage:
  shared_tb: 2
