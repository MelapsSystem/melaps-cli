[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melaps-cli"
version = "0.4.2"
description = "Command line interface for Melaps System GPU clusters"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6.0"]
authors = [{name = "Melaps System"}]

[project.scripts]
melaps = "melaps_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
